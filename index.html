<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FitFlow Pro - All-in-One Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfd; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-day { background: #4f46e5 !important; color: white !important; transform: translateY(-4px); box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3); }
        .view { display: none; }
        .view.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(241, 245, 249, 1); }
        input[type="checkbox"]:checked + span { text-decoration: line-through; opacity: 0.5; }
    </style>
</head>
<body class="min-h-screen pb-28 text-slate-900">

    <div id="setup-modal" class="fixed inset-0 bg-slate-900/60 z-[100] hidden items-center justify-center backdrop-blur-md p-6">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl space-y-5">
            <h2 class="text-2xl font-black text-slate-800 text-center lang-tdee-title">Profile Settings</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <input id="t-age" type="number" placeholder="Age" class="w-full bg-slate-50 rounded-2xl p-4 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <select id="t-gender" class="w-full bg-slate-50 rounded-2xl p-4 text-sm outline-none">
                        <option value="m">Male</option><option value="f">Female</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input id="t-height" type="number" placeholder="Height (cm)" class="w-full bg-slate-50 rounded-2xl p-4 text-sm outline-none">
                    <input id="t-weight" type="number" placeholder="Weight (kg)" class="w-full bg-slate-50 rounded-2xl p-4 text-sm outline-none">
                </div>
                <select id="t-activity" class="w-full bg-slate-50 rounded-2xl p-4 text-sm outline-none">
                    <option value="1.2">Sedentary</option>
                    <option value="1.375">Light (1-2 days/wk)</option>
                    <option value="1.55">Moderate (3-5 days/wk)</option>
                    <option value="1.725">Very Active</option>
                </select>
            </div>
            <button onclick="saveProfile()" class="w-full bg-indigo-600 text-white rounded-2xl py-4 font-bold shadow-lg hover:bg-indigo-700 transition-all">Save & Update</button>
            <button onclick="toggleModal('setup-modal', false)" class="w-full text-slate-400 text-xs font-bold uppercase">Cancel</button>
        </div>
    </div>

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative overflow-hidden">
        
        <div id="view-diary" class="view active">
            <header class="bg-slate-900 pt-14 pb-28 px-8 rounded-b-[3.5rem] relative">
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <p id="ui-date-display" class="text-indigo-400 text-[10px] font-black tracking-widest uppercase mb-1"></p>
                        <h1 class="text-3xl font-black text-white">FitFlow <span class="text-indigo-500">Pro</span></h1>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleLang()" class="bg-white/10 text-white px-3 py-1.5 rounded-xl text-[10px] font-black border border-white/10 hover:bg-white/20 transition-all">EN/中</button>
                        <button onclick="toggleModal('setup-modal', true)" class="bg-white/10 p-2.5 rounded-xl text-lg hover:bg-white/2
