<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FitFlow Elite - Pro Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-day { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important; color: white !important; transform: scale(1.05); }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glass-header { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); }
        .food-tag:active { transform: scale(0.95); }
        input[type="number"]::-webkit-inner-spin-button { display: none; }
    </style>
</head>
<body class="pb-24 text-slate-900">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative">
        
        <header class="glass-header pt-12 pb-24 px-6 rounded-b-[3rem] relative">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <p id="ui-date-display" class="text-indigo-400 text-[10px] font-extrabold tracking-[0.2em] uppercase"></p>
                    <h1 class="text-2xl font-extrabold text-white">FitFlow Elite</h1>
                </div>
                <button onclick="toggleModal('setup-modal', true)" class="bg-white/10 p-2.5 rounded-2xl text-lg hover:bg-white/20 transition-all">⚙️</button>
            </div>
            
            <div id="date-slider" class="flex justify-between gap-3 overflow-x-auto no-scrollbar py-2"></div>
        </header>

        <div class="mx-6 -mt-16 bg-white rounded-[2.5rem] shadow-2xl p-7 border border-slate-50 relative z-10">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Remaining / 剩餘</p>
                    <p id="remain-kcal" class="text-5xl font-[900] text-slate-900 tracking-tighter">0</p>
                </div>
                <div class="text-right space-y-1">
                    <div class="text-[10px] font-bold text-slate-500 flex items-center justify-end gap-2">
                        <span>Goal: <span id="goal-val">2000</span></span>
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    </div>
                    <div class="text-[10px] font-bold text-slate-500 flex items-center justify-end gap-2">
                        <span>Food: <span id="eaten-val">0</span></span>
                        <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-4 pt-5 border-t border-slate-50">
                <div class="text-center">
                    <p class="text-[9px] font-black text-rose-500 uppercase">Protein</p>
                    <p class="text-sm font-extrabold text-slate-700"><span id="p-val">0</span>g</p>
                </div>
                <div class="text-center border-x border-slate-50">
                    <p class="text-[9px] font-black text-indigo-500 uppercase">Carbs</p>
                    <p class="text-sm font-extrabold text-slate-700"><span id="c-val">0</span>g</p>
                </div>
                <div class="text-center">
                    <p class="text-[9px] font-black text-amber-500 uppercase">Fats</p>
                    <p class="text-sm font-extrabold text-slate-700"><span id="f-val">0</span>g</p>
                </div>
            </div>
        </div>

        <main id="view-diary" class="view active p-6 space-y-8">
            
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest">Food Database / 食品庫</h3>
                    <select id="food-cat" onchange="filterFood()" class="text-[10px] font-bold bg-slate-100 rounded-xl px-3 py-1.5 border-none outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="all">全部類別</option>
                        <option value="protein">蛋白質 (肉/蛋)</option>
                        <option value="carbs">碳水 (米面/粉)</option>
                        <option value="veg">蔬果</option>
                        <option value="fastfood">快餐外賣</option>
                        <option value="snacks">零食飲品</option>
                    </select>
                </div>
                <div id="food-tags" class="flex flex-wrap gap-2 max-h-48 overflow-y-auto no-scrollbar p-1">
                    </div>
            </div>

            <div class="bg-slate-900 p-6 rounded-[2.5rem] shadow-xl space-y-4">
                <div class="flex gap-2">
                    <input id="f-name" type="text" placeholder="食物名稱..." class="flex-1 bg-white/10 rounded-2xl p-4 text-sm text-white placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-indigo-500 font-medium transition-all">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="flex bg-white/10 rounded-2xl overflow-hidden ring-1 ring-white/10">
                        <input id="f-amt" type="number" placeholder="份量" class="w-full bg-transparent p-4 text-sm text-white font-bold outline-none">
                        <select id="f-unit" class="bg-white/5 text-white text-[10px] px-2 font-black border-none outline-none">
                            <option value="g">克 (g)</option>
                            <option value="pcs">件 (pcs)</option>
                        </select>
                    </div>
                    <input id="f-kcal-custom" type="number" placeholder="熱量/100g" class="bg-white/10 rounded-2xl p-4 text-sm text-white font-bold outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button onclick="addEntry()" class="w-full bg-indigo-600 text-white rounded-2xl py-4 font-bold text-sm shadow-lg shadow-indigo-500/30 active:scale-95 transition-all">加入今日記錄</button>
            </div>

            <div class="space-y-4 pb-12">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest">Daily Record / 今日記錄</h3>
                    <button onclick="clearDay()" class="text-[10px] font-bold text-rose-400 uppercase tracking-widest">全部清空</button>
                </div>
                <ul id="diary-list" class="space-y-3"></ul>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/80 backdrop-blur-xl border-t border-slate-100 p-5 flex justify-around items-center z-50 rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
            <button class="flex flex-col items-center gap-1 text-indigo-600">
                <span class="text-2xl">📖</span><span class="text-[9px] font-black tracking-widest uppercase">Diary</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-slate-300">
                <span class="text-2xl">💪</span><span class="text-[9px] font-black tracking-widest uppercase">Health</span>
            </button>
        </nav>
    </div>

    <div id="setup-modal" class="fixed inset-0 bg-black/60 z-[100] hidden items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl space-y-5">
            <h2 class="text-2xl font-extrabold text-slate-800 text-center">個人設定 (TDEE)</h2>
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <input id="t-age" type="number" placeholder="年齡" class="w-full bg-slate-50 rounded-2xl p-4 text-sm border-none ring-1 ring-slate-200">
                    <select id="t-gender" class="w-full bg-slate-50 rounded-2xl p-4 text-sm border-none ring-1 ring-slate-200">
                        <option value="m">男</option><option value="f">女</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input id="t-height" type="number" placeholder="身高 (cm)" class="w-full bg-slate-50 rounded-2xl p-4 text-sm border-none ring-1 ring-slate-200">
                    <input id="t-weight" type="number" placeholder="體重 (kg)" class="w-full bg-slate-50 rounded-2xl p-4 text-sm border-none ring-1 ring-slate-200">
                </div>
                <select id="t-activity" class="w-full bg-slate-50 rounded-2xl p-4 text-sm border-none ring-1 ring-slate-200">
                    <option value="1.2">久坐 (辦公室)</option>
                    <option value="1.375">輕度 (每週運動1-2天)</option>
                    <option value="1.55">中度 (每週運動3-5天)</option>
                    <option value="1.725">高度 (運動員)</option>
                </select>
            </div>
            <button onclick="saveTDEE()" class="w-full bg-indigo-600 text-white rounded-2xl py-4 font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all">儲存 Profile</button>
            <button onclick="toggleModal('setup-modal', false)" class="w-full text-slate-400 text-xs font-semibold uppercase tracking-widest">關閉</button>
        </div>
    </div>

    <script>
        // --- 1. FOOD DATABASE (100 Items Placeholder Structure) ---
        const FOOD_DB = [
            // PROTEIN
            { id: 1, cat: 'protein', n: "雞胸肉", k: 165, p: 31, c: 0, f: 3.6, i: "🐔" },
            { id: 2, cat: 'protein', n: "雞蛋", k: 155, p: 13, c: 1.1, f: 11, i: "🥚", pw: 50 },
            { id: 3, cat: 'protein', n: "三文魚", k: 208, p: 20, c: 0, f: 13, i: "🐟" },
            { id: 4, cat: 'protein', n: "瘦牛肉", k: 250, p: 26, c: 0, f: 15, i: "🥩" },
            { id: 5, cat: 'protein', n: "希臘乳酪", k: 59, p: 10, c: 3.6, f: 0.4, i: "🍦" },
            { id: 6, cat: 'protein', n: "蛋白粉", k: 390, p: 80, c: 8, f: 4, i: "🥤", pw: 30 },
            { id: 7, cat: 'protein', n: "硬豆腐", k: 83, p: 8.5, c: 2, f: 4.8, i: "🧊" },
            { id: 8, cat: 'protein', n: "吞拿魚罐頭", k: 116, p: 26, c: 0, f: 0.8, i: "🥫" },
            // CARBS
            { id: 10, cat: 'carbs', n: "白飯", k: 130, p: 2.7, c: 28, f: 0.3, i: "🍚" },
            { id: 11, cat: 'carbs', n: "玄米飯", k: 111, p: 2.6, c: 23, f: 0.9, i: "🌾" },
            { id: 12, cat: 'carbs', n: "番薯", k: 86, p: 1.6, c: 20, f: 0.1, i: "🍠" },
            { id: 13, cat: 'carbs', n: "燕麥", k: 389, p: 17, c: 66, f: 7, i: "🥣" },
            { id: 14, cat: 'carbs', n: "義大利麵", k: 158, p: 5.8, c: 31, f: 0.9, i: "🍝" },
            { id: 15, cat: 'carbs', n: "全麥麵包", k: 247, p: 13, c: 41, f: 3.4, i: "🍞", pw: 35 },
            // VEG/FRUIT
            { id: 20, cat: 'veg', n: "西蘭花", k: 34, p: 2.8, c: 7, f: 0.4, i: "🥦" },
            { id: 21, cat: 'veg', n: "牛油果", k: 160, p: 2, c: 8.5, f: 15, i: "🥑" },
            { id: 22, cat: 'veg', n: "蘋果", k: 52, p: 0.3, c: 14, f: 0.2, i: "🍎" },
            { id: 23, cat: 'veg', n: "香蕉", k: 89, p: 1.1, c: 23, f: 0.3, i: "🍌" },
            // FASTFOOD
            { id: 30, cat: 'fastfood', n: "巨無霸", k: 257, p: 12, c: 20, f: 14, i: "🍔", pw: 215 },
            { id: 31, cat: 'fastfood', n: "麥樂雞", k: 302, p: 15, c: 18, f: 19, i: "🍗", pw: 20 },
            { id: 32, cat: 'fastfood', n: "薄餅", k: 266, p: 11, c: 33, f: 10, i: "🍕" },
            // SNACKS
            { id: 40, cat: 'snacks', n: "薯片", k: 536, p: 7, c: 53, f: 35, i: "🍟" },
            { id: 41, cat: 'snacks', n: "黑朱古力", k: 546, p: 5, c: 61, f: 31, i: "🍫" },
            { id: 42, cat: 'snacks', n: "可樂", k: 42, p: 0, c: 10, f: 0, i: "🥤" },
        ];
        
        // 快速擴充至 100 筆 (此處僅示範循環，實際建議手動填入)
        for(let i=50; i<=120; i++) {
            FOOD_DB.push({ id: i, cat: 'snacks', n: `食品 ${i}`, k: 100, p: 2, c: 10, f: 5, i: "🍱" });
        }

        // --- 2. CORE LOGIC ---
        let selectedDate = new Date().toISOString().split('T')[0];
        let profile = JSON.parse(localStorage.getItem('fit_pro_p')) || { tdee: 2000 };
        let logs = JSON.parse(localStorage.getItem('fit_pro_l')) || {};
        let activeP = null;

        document.addEventListener('DOMContentLoaded', () => {
            initDateSlider();
            loadDate();
            filterFood();
        });

        function filterFood() {
            const cat = document.getElementById('food-cat').value;
            const container = document.getElementById('food-tags');
            const items = cat === 'all' ? FOOD_DB : FOOD_DB.filter(f => f.cat === cat);
            
            container.innerHTML = items.map(f => `
                <button onclick="pickP(${f.id})" class="food-tag flex items-center gap-2 bg-slate-50 border border-slate-100 px-4 py-2.5 rounded-2xl hover:bg-indigo-50 hover:border-indigo-200 transition-all shadow-sm">
                    <span class="text-base">${f.i}</span>
                    <span class="text-[11px] font-bold text-slate-600">${f.n}</span>
                </button>
            `).join('');
        }

        function pickP(id) {
            activeP = FOOD_DB.find(x => x.id === id);
            document.getElementById('f-name').value = activeP.n;
            document.getElementById('f-kcal-custom').value = activeP.k;
            document.getElementById('f-amt').focus();
        }

        function addEntry() {
            const n = document.getElementById('f-name').value;
            const amt = parseFloat(document.getElementById('f-amt').value);
            const unit = document.getElementById('f-unit').value;
            const customKcal = parseFloat(document.getElementById('f-kcal-custom').value);

            if (!n || isNaN(amt)) return;

            let base = activeP || { k: customKcal || 0, p: 0, c: 0, f: 0 };
            
            // 精準比例計算
            let ratio = (unit === 'pcs' && base.pw) ? (amt * base.pw / 100) : (amt / 100);
            if (unit === 'pcs' && !base.pw) ratio = amt; // 如果選件數但無預設重量，就當作 amt * 100g 計算

            const entry = {
                id: Date.now(),
                n: n,
                k: Math.round(base.k * ratio),
                p: (base.p * ratio).toFixed(1),
                c: (base.c * ratio).toFixed(1),
                f: (base.f * ratio).toFixed(1),
                amt: amt,
                unit: unit
            };

            logs[selectedDate].foods.unshift(entry);
            save(); renderDiary(); updateDashboard();
            resetForm();
        }

        function updateKcal(id, newVal) {
            const entry = logs[selectedDate].foods.find(f => f.id === id);
            if(entry) {
                entry.k = parseInt(newVal) || 0;
                save(); updateDashboard();
            }
        }

        function renderDiary() {
            const list = document.getElementById('diary-list');
            list.innerHTML = logs[selectedDate].foods.map(f => `
                <li class="bg-white p-5 rounded-3xl border border-slate-50 shadow-sm flex justify-between items-center group transition-all">
                    <div class="flex-1">
                        <p class="text-[13px] font-extrabold text-slate-800">${f.n} <span class="text-[10px] text-slate-400 font-medium ml-1">${f.amt}${f.unit}</span></p>
                        <p class="text-[9px] font-bold text-slate-300 mt-0.5 tracking-wider uppercase">P: ${f.p} | C: ${f.c} | F: ${f.f}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="relative">
                            <input type="number" onchange="updateKcal(${f.id}, this.value)" value="${f.k}" class="w-16 bg-slate-50 text-right font-black text-indigo-600 py-1.5 px-2 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <button onclick="removeEntry(${f.id})" class="text-slate-200 hover:text-rose-500 transition-colors">✕</button>
                    </div>
                </li>
            `).join('');
        }

        function updateDashboard() {
            const d = logs[selectedDate];
            const eaten = d.foods.reduce((s, f) => s + f.k, 0);
            const macros = d.foods.reduce((m, f) => {
                m.p += parseFloat(f.p); m.c += parseFloat(f.c); m.f += parseFloat(f.f); return m;
            }, {p:0, c:0, f:0});

            document.getElementById('remain-kcal').innerText = profile.tdee - eaten;
            document.getElementById('goal-val').innerText = profile.tdee;
            document.getElementById('eaten-val').innerText = eaten;
            document.getElementById('p-val').innerText = macros.p.toFixed(0);
            document.getElementById('c-val').innerText = macros.c.toFixed(0);
            document.getElementById('f-val').innerText = macros.f.toFixed(0);
        }

        // --- UTILS ---
        function save() {
            localStorage.setItem('fit_pro_p', JSON.stringify(profile));
            localStorage.setItem('fit_pro_l', JSON.stringify(logs));
        }

        function loadDate() {
            if (!logs[selectedDate]) logs[selectedDate] = { foods: [], water: 0 };
            renderDiary(); updateDashboard();
        }

        function initDateSlider() {
            const container = document.getElementById('date-slider');
            container.innerHTML = '';
            for (let i = -3; i <= 3; i++) {
                let d = new Date(); d.setDate(d.getDate() + i);
                let ds = d.toISOString().split('T')[0];
                const btn = document.createElement('button');
                btn.className = `flex flex-col items-center min-w-[55px] p-3 rounded-2xl transition-all ${ds === selectedDate ? 'active-day shadow-lg shadow-indigo-200' : 'bg-white/5 text-white/50 hover:bg-white/10'}`;
                btn.onclick = () => { selectedDate = ds; initDateSlider(); loadDate(); };
                btn.innerHTML = `<span class="text-[8px] font-black uppercase mb-1">${d.toLocaleDateString('zh-HK',{weekday:'short'})}</span><span class="text-lg font-black">${d.getDate()}</span>`;
                container.appendChild(btn);
            }
            document.getElementById('ui-date-display').innerText = new Date(selectedDate).toLocaleDateString('zh-HK', {month:'long', day:'numeric', weekday:'long'});
        }

        function saveTDEE() {
            const age = document.getElementById('t-age').value, w = document.getElementById('t-weight').value, h = document.getElementById('t-height').value;
            if(!age || !w || !h) return;
            const bmr = (document.getElementById('t-gender').value === 'm') ? (10*w)+(6.25*h)-(5*age)+5 : (10*w)+(6.25*h)-(5*age)-161;
            profile.tdee = Math.round(bmr * document.getElementById('t-activity').value);
            save(); updateDashboard(); toggleModal('setup-modal', false);
        }

        function removeEntry(id) { logs[selectedDate].foods = logs[selectedDate].foods.filter(x => x.id !== id); save(); renderDiary(); updateDashboard(); }
        function clearDay() { if(confirm("確定清空今日記錄？")) { logs[selectedDate].foods = []; save(); renderDiary(); updateDashboard(); } }
        function toggleModal(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; }
        function resetForm() { document.getElementById('f-name').value = ''; document.getElementById('f-amt').value = ''; activeP = null; }
    </script>
</body>
</html>
