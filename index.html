<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FitFlow UK Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-day { background-color: #4f46e5 !important; color: white !important; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4); }
        .view { display: none; }
        .view.active { display: block; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
        .quick-tag { @apply px-3 py-1 bg-slate-100 rounded-full text-xs font-bold text-slate-600 hover:bg-indigo-100 hover:text-indigo-600 transition cursor-pointer; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900 pb-24">

    <div id="setup-modal" class="modal px-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
            <h2 class="text-xl font-black text-indigo-600 text-center">TDEE 計算器</h2>
            <div class="grid grid-cols-2 gap-2">
                <input id="t-age" type="number" placeholder="年齡" class="border rounded-xl p-3 text-sm bg-slate-50">
                <select id="t-gender" class="border rounded-xl p-3 text-sm bg-slate-50"><option value="m">男</option><option value="f">女</option></select>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <input id="t-height" type="number" placeholder="身高(cm)" class="border rounded-xl p-3 text-sm bg-slate-50">
                <input id="t-weight" type="number" placeholder="體重(kg)" class="border rounded-xl p-3 text-sm bg-slate-50">
            </div>
            <select id="t-activity" class="w-full border rounded-xl p-3 text-sm bg-slate-50">
                <option value="1.2">久坐 (辦公室)</option>
                <option value="1.375">輕量 (運動1-3天)</option>
                <option value="1.55">中量 (運動3-5天)</option>
                <option value="1.725">大量 (運動6-7天)</option>
            </select>
            <button onclick="saveTDEE()" class="w-full bg-indigo-600 text-white rounded-xl py-3 font-bold shadow-lg shadow-indigo-200">設定每日目標</button>
            <button onclick="closeModal('setup-modal')" class="w-full text-slate-400 text-xs">稍後再說</button>
        </div>
    </div>

    <div class="max-w-md mx-auto bg-white min-h-screen relative shadow-2xl overflow-hidden">
        
        <div id="view-diary" class="view active">
            <header class="bg-indigo-600 p-6 pb-24 text-white rounded-b-[2.5rem] shadow-lg">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <p id="ui-date-display" class="text-[10px] font-bold opacity-70 uppercase tracking-widest">Tuesday, 14 April</p>
                        <h1 class="text-2xl font-black">FitFlow Diary</h1>
                    </div>
                    <button onclick="openModal('setup-modal')" class="bg-white/20 p-2 rounded-xl text-lg">⚙️</button>
                </div>
                
                <div id="date-slider" class="flex justify-between gap-2 overflow-x-auto no-scrollbar pb-2">
                    </div>
            </header>

            <div class="mx-6 -mt-16 bg-white rounded-3xl shadow-xl p-6 border border-slate-50 flex justify-between items-end relative z-10">
                <div class="space-y-1">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Remaining Kcal</p>
                    <p id="remain-kcal" class="text-4xl font-black text-indigo-600">0</p>
                    <div class="flex gap-2 text-[10px] font-bold">
                        <span class="text-slate-400">Goal: <span id="goal-val" class="text-slate-600">2000</span></span>
                        <span class="text-emerald-500">Burned: +<span id="exe-val">0</span></span>
                    </div>
                </div>
                <div class="text-right text-[10px] font-bold space-y-1 pb-1">
                    <div class="text-rose-500">P: <span id="p-val">0</span>g</div>
                    <div class="text-sky-500">C: <span id="c-val">0</span>g</div>
                    <div class="text-amber-500">F: <span id="f-val">0</span>g</div>
                </div>
            </div>

            <main class="p-6 space-y-6">
                <div>
                    <h3 class="text-xs font-black text-slate-400 mb-3 uppercase tracking-widest">常見健身食品 (快捷)</h3>
                    <div class="flex flex-wrap gap-2">
                        <div onclick="quickAddFood('雞胸肉(熟)', 165, 31, 0, 3.6)" class="quick-tag">🐔 雞胸肉</div>
                        <div onclick="quickAddFood('大號雞蛋(隻)', 78, 6.3, 0.6, 5)" class="quick-tag">🥚 雞蛋</div>
                        <div onclick="quickAddFood('希臘乳酪', 59, 10, 3.6, 0.4)" class="quick-tag">🍦 希臘乳酪</div>
                        <div onclick="quickAddFood('蛋白粉(份)', 120, 24, 3, 1.5)" class="quick-tag">🥤 蛋白粉</div>
                        <div onclick="quickAddFood('燕麥(乾)', 389, 17, 66, 7)" class="quick-tag">🥣 燕麥</div>
                        <div onclick="quickAddFood('牛油果', 160, 2, 8.5, 15)" class="quick-tag">🥑 牛油果</div>
                    </div>
                </div>

                <div class="bg-slate-50 p-5 rounded-3xl border border-slate-100 space-y-3">
                    <div id="reader" class="hidden rounded-2xl overflow-hidden mb-3"></div>
                    <div class="flex gap-2">
                        <button onclick="startScan()" class="bg-slate-900 text-white px-4 rounded-2xl font-bold">📷</button>
                        <input id="food-name" type="text" placeholder="食品名稱" class="flex-1 border-none bg-white rounded-2xl p-3 text-sm shadow-sm">
                    </div>
                    <div class="flex gap-2">
                        <input id="food-weight" type="number" placeholder="重量/件數" class="flex-1 border-none bg-white rounded-2xl p-3 text-sm shadow-sm">
                        <select id="weight-unit" class="bg-white rounded-2xl px-4 text-xs font-bold border-none shadow-sm">
                            <option value="g">克(g)</option>
                            <option value="pcs">件(pcs)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="addEntry('diary')" class="bg-indigo-600 text-white rounded-2xl py-3 font-bold text-sm shadow-lg shadow-indigo-100">＋ 加入今日紀錄</button>
                        <button onclick="addEntry('shop')" class="bg-amber-500 text-white rounded-2xl py-3 font-bold text-sm shadow-lg shadow-amber-100">🛒 加入購物清單</button>
                    </div>
                </div>

                <div class="space-y-3 pb-10">
                    <h3 class="font-black text-slate-800 flex justify-between items-center">今日飲食紀錄 <button onclick="clearDay()" class="text-[10px] text-rose-400">清空</button></h3>
                    <ul id="food-list" class="space-y-3"></ul>
                </div>
            </main>
        </div>

        <div id="view-health" class="view">
            <header class="p-8 pt-12"><h1 class="text-3xl font-black">Health Track</h1></header>
            <main class="p-6 space-y-6">
                <div class="bg-blue-500 p-6 rounded-[2rem] text-white flex justify-between items-center shadow-xl shadow-blue-100">
                    <div>
                        <p class="text-xs font-bold opacity-80 uppercase">Water Today</p>
                        <p class="text-4xl font-black"><span id="water-val">0.0</span> <small class="text-sm">L</small></p>
                    </div>
                    <button onclick="addWater(0.25)" class="bg-white/20 h-16 w-16 rounded-2xl text-3xl font-bold hover:bg-white/30 transition">＋</button>
                </div>

                <div class="bg-white p-6 rounded-[2rem] border shadow-sm space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-black text-slate-800">體重趨勢</h3>
                        <div class="flex gap-2">
                            <input id="w-input" type="number" step="0.1" placeholder="kg" class="w-16 bg-slate-100 border-none rounded-lg p-2 text-xs font-bold">
                            <button onclick="saveWeight()" class="bg-slate-900 text-white px-3 py-2 rounded-lg text-[10px] font-bold">記錄</button>
                        </div>
                    </div>
                    <canvas id="weightChart" height="180"></canvas>
                </div>

                <div class="bg-slate-900 p-6 rounded-[2rem] text-white space-y-4">
                    <h3 class="font-bold text-sm">熱門運動快捷</h3>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="quickAddExe('慢跑 (30min)', 300)" class="px-3 py-2 bg-white/10 rounded-xl text-xs hover:bg-white/20">🏃 慢跑</button>
                        <button onclick="quickAddExe('重訓 (1hr)', 250)" class="px-3 py-2 bg-white/10 rounded-xl text-xs hover:bg-white/20">🏋️ 重訓</button>
                        <button onclick="quickAddExe('游泳 (30min)', 400)" class="px-3 py-2 bg-white/10 rounded-xl text-xs hover:bg-white/20">🏊 游泳</button>
                        <button onclick="quickAddExe('HIIT (20min)', 200)" class="px-3 py-2 bg-white/10 rounded-xl text-xs hover:bg-white/20">🔥 HIIT</button>
                        <button onclick="quickAddExe('步行 (5km)', 250)" class="px-3 py-2 bg-white/10 rounded-xl text-xs hover:bg-white/20">🚶 步行</button>
                    </div>
                    <div class="flex gap-2 pt-2 border-t border-white/10">
                        <input id="e-name" type="text" placeholder="自定義運動" class="flex-1 bg-white/10 border-none rounded-xl p-3 text-xs">
                        <input id="e-kcal" type="number" placeholder="Kcal" class="w-20 bg-white/10 border-none rounded-xl p-3 text-xs">
                        <button onclick="addExercise()" class="bg-rose-500 px-4 rounded-xl font-bold">＋</button>
                    </div>
                </div>
            </main>
        </div>

        <div id="view-shop" class="view">
            <header class="p-8 pt-12 flex justify-between items-center"><h1 class="text-3xl font-black">Shopping</h1><button onclick="clearShop()" class="text-xs text-rose-400">清空</button></header>
            <main class="p-6">
                <div class="flex gap-2 mb-6">
                    <input id="s-input" type="text" placeholder="想買什麼..." class="flex-1 bg-slate-100 border-none rounded-2xl p-4 text-sm font-medium">
                    <button onclick="addShop()" class="bg-amber-500 text-white px-6 rounded-2xl font-black">＋</button>
                </div>
                <ul id="shop-list" class="space-y-3"></ul>
            </main>
        </div>

        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/80 backdrop-blur-md border-t p-4 flex justify-around items-center z-50 rounded-t-[2rem] shadow-2xl">
            <button onclick="switchView('view-diary')" class="flex flex-col items-center gap-1 text-indigo-600"><span class="text-xl">📖</span><span class="text-[9px] font-bold">DIARY</span></button>
            <button onclick="switchView('view-health')" class="flex flex-col items-center gap-1 text-slate-400"><span class="text-xl">💪</span><span class="text-[9px] font-bold">HEALTH</span></button>
            <button onclick="switchView('view-shop')" class="flex flex-col items-center gap-1 text-slate-400"><span class="text-xl">🛒</span><span class="text-[9px] font-bold">SHOP</span></button>
        </nav>
    </div>

    <script>
        // --- 核心數據與初始化 ---
        let selectedDate = new Date().toISOString().split('T')[0]; // 當前選取的日期 (格式: YYYY-MM-DD)
        
        // 從 LocalStorage 獲取數據，若無則初始化
        let userProfile = JSON.parse(localStorage.getItem('fitProfile')) || { tdee: 2000, weights: [] };
        let allLogs = JSON.parse(localStorage.getItem('fitLogs')) || {}; // 格式: {'2024-05-20': {foods:[], water:0, exes:[]}}
        let shopItems = JSON.parse(localStorage.getItem('fitShop')) || [];

        let weightChart = null;
        let tempScanned = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderDateSlider();
            loadDateData();
            initChart();
            renderShop();
        });

        // --- 日期與週計劃邏輯 ---
        function renderDateSlider() {
            const slider = document.getElementById('date-slider');
            slider.innerHTML = '';
            
            // 生成過去 3 天 + 今天 + 未來 3 天，共 7 天
            for (let i = -3; i <= 3; i++) {
                let d = new Date();
                d.setDate(d.getDate() + i);
                let dateStr = d.toISOString().split('T')[0];
                let isToday = i === 0;
                let dayName = d.toLocaleDateString('en-US', {weekday: 'short'});
                let dayNum = d.getDate();

                const btn = document.createElement('button');
                btn.className = `day-btn flex-1 min-w-[55px] p-3 rounded-2xl flex flex-col items-center transition ${dateStr === selectedDate ? 'active-day' : 'bg-white/10'}`;
                btn.onclick = () => { selectedDate = dateStr; renderDateSlider(); loadDateData(); };
                btn.innerHTML = `<span class="text-[9px] font-bold opacity-70">${dayName}</span><span class="text-lg font-black">${dayNum}</span>`;
                slider.appendChild(btn);
            }
            document.getElementById('ui-date-display').innerText = new Date(selectedDate).toLocaleDateString('en-US', {month: 'long', day: 'numeric', weekday: 'long'});
        }

        function loadDateData() {
            if (!allLogs[selectedDate]) {
                allLogs[selectedDate] = { foods: [], water: 0, exes: [] };
            }
            renderDiary();
            updateStats();
        }

        // --- 飲食功能 ---
        async function startScan() {
            const reader = document.getElementById('reader');
            reader.classList.remove('hidden');
            const scanner = new Html5Qrcode("reader");
            await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, async (code) => {
                scanner.stop(); reader.classList.add('hidden');
                const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
                const data = await res.json();
                if (data.status === 1) {
                    const p = data.product;
                    tempScanned = { name: p.product_name_en || p.product_name || "UK Item", kcal: p.nutriments['energy-kcal_100g']||0, p: p.nutriments.proteins_100g||0, c: p.nutriments.carbohydrates_100g||0, f: p.nutriments.fat_100g||0 };
                    document.getElementById('food-name').value = tempScanned.name;
                    alert("掃描成功！請輸入重量。");
                }
            });
        }

        function quickAddFood(name, kcal, p, c, f) {
            document.getElementById('food-name').value = name;
            tempScanned = { name, kcal, p, c, f };
            document.getElementById('food-weight').focus();
        }

        function addEntry(type) {
            const name = document.getElementById('food-name').value;
            const val = parseFloat(document.getElementById('food-weight').value);
            const unit = document.getElementById('weight-unit').value;
            if (!name || isNaN(val)) return alert("請輸入名稱和份量");

            const base = tempScanned || { kcal: 0, p: 0, c: 0, f: 0 };
            const ratio = (unit === 'pcs') ? val : val / 100;

            const entry = { id: Date.now(), name, kcal: Math.round(base.kcal * ratio), p: (base.p * ratio).toFixed(1), c: (base.c * ratio).toFixed(1), f: (base.f * ratio).toFixed(1), vol: val+unit };

            if (type === 'diary') {
                allLogs[selectedDate].foods.unshift(entry);
                saveAll();
                renderDiary();
                updateStats();
            } else {
                shopItems.unshift({ id: Date.now(), name, entry });
                saveAll();
                renderShop();
                switchView('view-shop');
            }
            // 重置
            document.getElementById('food-name').value = '';
            document.getElementById('food-weight').value = '';
            tempScanned = null;
        }

        function renderDiary() {
            const list = document.getElementById('food-list');
            list.innerHTML = allLogs[selectedDate].foods.map(f => `
                <li class="bg-white p-4 rounded-2xl border flex justify-between items-center shadow-sm">
                    <div><p class="font-bold text-sm">${f.name}</p><p class="text-[9px] text-slate-400 font-bold uppercase">${f.vol} • P:${f.p} C:${f.c} F:${f.f}</p></div>
                    <div class="flex items-center gap-3"><span class="font-black text-indigo-600">${f.kcal}</span><button onclick="delFood(${f.id})" class="text-rose-200">✕</button></div>
                </li>
            `).join('');
        }

        function updateStats() {
            const data = allLogs[selectedDate];
            const eaten = data.foods.reduce((s, i) => s + i.kcal, 0);
            const burned = data.exes.reduce((s, i) => s + i.kcal, 0);
            const remain = userProfile.tdee - eaten + burned;

            document.getElementById('remain-kcal').innerText = remain;
            document.getElementById('goal-val').innerText = userProfile.tdee;
            document.getElementById('exe-val').innerText = burned;
            document.getElementById('water-val').innerText = (data.water || 0).toFixed(1);
            
            document.getElementById('p-val').innerText = data.foods.reduce((s, i) => s + parseFloat(i.p), 0).toFixed(1);
            document.getElementById('c-val').innerText = data.foods.reduce((s, i) => s + parseFloat(i.c), 0).toFixed(1);
            document.getElementById('f-val').innerText = data.foods.reduce((s, i) => s + parseFloat(i.f), 0).toFixed(1);
        }

        // --- 健康功能 ---
        function addWater(v) { allLogs[selectedDate].water += v; saveAll(); updateStats(); }

        function quickAddExe(name, kcal) {
            allLogs[selectedDate].exes.push({ id: Date.now(), name, kcal });
            saveAll(); updateStats(); alert(`已加入: ${name}`);
        }

        function addExercise() {
            const name = document.getElementById('e-name').value;
            const kcal = parseInt(document.getElementById('e-kcal').value);
            if (!name || !kcal) return;
            allLogs[selectedDate].exes.push({ id: Date.now(), name, kcal });
            saveAll(); updateStats();
            document.getElementById('e-name').value = ''; document.getElementById('e-kcal').value = '';
        }

        function saveWeight() {
            const v = parseFloat(document.getElementById('w-input').value);
            if (!v) return;
            userProfile.weights.push({ date: selectedDate, value: v });
            userProfile.weights.sort((a,b) => new Date(a.date) - new Date(b.date));
            saveAll(); initChart();
            document.getElementById('w-input').value = '';
        }

        function initChart() {
            const ctx = document.getElementById('weightChart').getContext('2d');
            if (weightChart) weightChart.destroy();
            const last7 = userProfile.weights.slice(-7);
            weightChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: last7.map(w => w.date.split('-').slice(1).join('/')),
                    datasets: [{ data: last7.map(w => w.value), borderColor: '#4f46e5', tension: 0.4, fill: false, pointRadius: 5 }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { grid: { display: false } }, x: { grid: { display: false } } } }
            });
        }

        // --- 購物清單 ---
        function renderShop() {
            document.getElementById('shop-list').innerHTML = shopItems.map(i => `
                <li class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center">
                    <span class="font-bold text-sm">${i.name}</span>
                    <button onclick="shopToDiary(${i.id})" class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-[10px] font-bold">Eat Now</button>
                </li>
            `).join('');
        }
        function addShop() {
            const name = document.getElementById('s-input').value;
            if(!name) return;
            shopItems.unshift({ id: Date.now(), name });
            saveAll(); renderShop(); document.getElementById('s-input').value = '';
        }
        function shopToDiary(id) {
            const item = shopItems.find(i => i.id === id);
            document.getElementById('food-name').value = item.name;
            shopItems = shopItems.filter(i => i.id !== id);
            saveAll(); renderShop(); switchView('view-diary');
            document.getElementById('food-weight').focus();
        }

        // --- 全局功能 ---
        function switchView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('nav button').forEach(b => b.classList.add('text-slate-400'));
            event.currentTarget.classList.remove('text-slate-400');
            event.currentTarget.classList.add('text-indigo-600');
        }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function saveTDEE() {
            const age = document.getElementById('t-age').value;
            const w = document.getElementById('t-weight').value;
            const h = document.getElementById('t-height').value;
            if(!age || !w || !h) return;
            const bmr = (document.getElementById('t-gender').value === 'm') ? (10*w)+(6.25*h)-(5*age)+5 : (10*w)+(6.25*h)-(5*age)-161;
            userProfile.tdee = Math.round(bmr * document.getElementById('t-activity').value);
            saveAll(); updateStats(); closeModal('setup-modal');
        }
        function saveAll() {
            localStorage.setItem('fitProfile', JSON.stringify(userProfile));
            localStorage.setItem('fitLogs', JSON.stringify(allLogs));
            localStorage.setItem('fitShop', JSON.stringify(shopItems));
        }
        function delFood(id) { allLogs[selectedDate].foods = allLogs[selectedDate].foods.filter(f => f.id !== id); saveAll(); renderDiary(); updateStats(); }
        function clearDay() { if(confirm("清空今日數據？")) { allLogs[selectedDate] = { foods:[], water:0, exes:[] }; saveAll(); renderDiary(); updateStats(); } }
        function clearShop() { shopItems = []; saveAll(); renderShop(); }
    </script>
</body>
</html>
